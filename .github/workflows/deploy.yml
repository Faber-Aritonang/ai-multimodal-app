name: Deploy to Railway & Vercel

# Deploy memakai CLI resmi (Railway CLI & Vercel CLI), BUKAN action pihak ketiga.
#
# Alasannya konkret: workflow sebelumnya memakai `railway/railway-github-action`
# (repositori action-nya sudah tidak ada sehingga job gagal di langkah "Set up
# job") dan `amondnet/vercel-action@v30` (tag v30 tidak pernah ada; rilisnya
# melompat ke v42). Keduanya bukan soal kode aplikasi, tapi referensi action yang
# bisa hilang kapan saja.
#
# Catatan: repo ini publik, jadi log run juga publik. Verifikasi pasca-deploy di
# bawah hanya membaca `/health` (tidak pernah mencetak nilai rahasia apa pun).
#
# Uji ulang referensi versi: `npm view @railway/cli version` dan
# `npm view vercel version`.

on:
  push:
    branches: [ main ]
  # PR ikut menjalankan quality gate. Sebelum ini PR bisa MERAH pada
  # test/lint/build dan tetap bisa di-merge, karena workflow-nya hanya berjalan
  # pada push ke `main` — jadi masalahnya baru ketahuan setelah masuk ke main,
  # saat keduanya sudah menyatu dan lebih mahal untuk dibatalkan.
  #
  # Job deploy TIDAK ikut berjalan di PR: keduanya dijaga oleh kondisi
  # `github.event_name == 'push'` di bawah, sehingga PR hanya menjalankan job
  # `quality` (test backend, lint & build frontend, penjaga registri spec).
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend to Railway'
        required: false
        default: 'true'
      deploy_frontend:
        description: 'Deploy Frontend to Vercel'
        required: false
        default: 'true'

# Deploy dijalankan satu per satu untuk ref yang sama: push baru menunggu
# deploy yang sedang berjalan selesai (tidak dibatalkan di tengah jalan, karena
# deploy yang terpotong bisa meninggalkan aplikasi dalam keadaan setengah jadi).
#
# Untuk PR aturannya berbeda: yang berjalan hanya quality gate, dan run yang
# sudah tidak relevan (push ke-2, ke-3, … pada PR yang sama) justru lebih baik
# dibatalkan — user sedang menunggu hasil commit TERAKHIR, bukan commit lama.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Dipin ke major version agar tidak berubah sendiri.
  RAILWAY_CLI_VERSION: '5'
  RAILWAY_ENVIRONMENT: 'production'
  # Nama service Railway. Nilainya bukan tebakan: project tujuan hanya punya
  # satu service, bernama "ai-multimodal-app". Bisa diganti tanpa mengubah
  # workflow dengan menambah secret RAILWAY_SERVICE.
  RAILWAY_SERVICE_DEFAULT: 'ai-multimodal-app'
  # URL publik backend produksi, dipakai langkah verifikasi pasca-deploy.
  PUBLIC_BACKEND_URL: 'https://ai-multimodal-app-production.up.railway.app'

jobs:
  # Quality gate: unit test backend + lint & build frontend.
  # Test backend tidak butuh kredensial apa pun (tanpa Mongo/Firebase).
  quality:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Menjaga berkas rahasia tidak ikut ter-push. Aturan `.gitignore` saja
      # tidak cukup: ia tidak berlaku pada berkas yang sudah ter-track dan tidak
      # menahan `git add -f`. `backend/.env.save.1` pernah lolos ke repo dengan
      # JWT_SECRET, GROQ_API_KEY, dan OPENROUTER_API_KEY di dalamnya.
      #
      # Skrip ini hanya mencetak lokasi dan nama aturan, tidak pernah nilai yang
      # cocok — log run repo ini publik. Ditempatkan sebelum instalasi
      # dependency supaya gagal lebih cepat.
      - name: Tidak ada berkas rahasia yang ter-commit
        run: node scripts/check-no-secrets.js

      # Penjaga registri uji browser. Uji browser sendiri dijalankan manual
      # (butuh Chrome + backend + frontend + database, lihat README), sehingga
      # spec yang lupa didaftarkan di run.cjs TIDAK PERNAH dijalankan siapa pun.
      # Pemeriksaan ini murah: hanya membaca daftar berkas dan isi run.cjs.
      - name: Registri uji browser - setiap spec terdaftar
        run: node scripts/check-browser-specs.js

      - name: Backend - install dependencies
        run: npm ci
        working-directory: backend

      - name: Backend - run unit tests
        run: npm test
        working-directory: backend

      - name: Frontend - install dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend - lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend - build
        run: npm run build
        working-directory: frontend

  # Deploy Backend ke Railway.
  #
  # `railway up` mengunggah direktori backend dan membangunnya di Railway
  # (Nixpacks mendeteksi Node dari package.json), jadi tidak perlu memasang
  # dependency di runner. Tanpa `--detach`, perintah ini menunggu build selesai
  # dan gagal kalau build-nya gagal — itu yang membuat status job jujur.
  deploy-backend:
    needs: quality
    # Hanya pada push ke main, atau saat dijalankan manual dengan input-nya
    # diaktifkan. Dinyatakan eksplisit (bukan hanya `inputs.deploy_backend ==
    # 'true'`) supaya penambahan event baru di masa depan tidak tanpa sengaja
    # ikut men-deploy.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_backend == 'true')
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      # Opsional: diisi hanya kalau nama service-nya bukan default di atas.
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Pastikan kredensial tersedia
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Secret RAILWAY_TOKEN belum diisi di repo ini."
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "::error::Secret RAILWAY_PROJECT_ID belum diisi di repo ini."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"

      # PENTING — `railway up` dijalankan dari AKAR repo, bukan dari `backend/`.
      # Service Railway menetapkan `rootDirectory: backend`, dan builder
      # menggabungkannya dengan konteks unggahan: mengunggah direktori `backend`
      # membuat builder mencari `backend/backend` lalu gagal (deployment
      # `FAILED` dengan `commit=-`, tanpa log build yang menjelaskan sebabnya).
      # Dari akar repo, konteks unggahan sama dengan konteks deployment GitHub,
      # sehingga `backend/` terbentuk benar.
      # Kegagalan yang pernah terjadi: `railway up` berhenti dengan
      # `Service 'ai-multimodal-app' not found`. Penyebabnya BUKAN kode, melainkan
      # nilai secret — dan ada DUA sebab yang menghasilkan pesan identik:
      # `RAILWAY_PROJECT_ID` menunjuk project yang tidak memuat service backend
      # (di akun ini hanya satu dari dua project yang punya service itu), atau
      # `RAILWAY_TOKEN` adalah token PROJECT milik project lain — token project
      # hanya berlaku pada project tempat ia dibuat dan tidak mengenal project lain
      # sama sekali. Keduanya mengulang di setiap push tanpa menjelaskan apa pun.
      #
      # Karena itu output `railway up` direkam: kalau pesannya memang "not found",
      # job ini mencetak langkah perbaikannya (tanpa mencetak nilai secret — GitHub
      # sudah menyamarkan secret di log, dan URI/log Railway tidak memuat
      # kredensial).
      #
      # Step di bawah memisahkan kedua sebab itu LEBIH DULU, dengan membandingkan
      # daftar project yang benar-benar bisa dibaca token terhadap id project dan
      # nama service yang dipakai.
      #
      # Langkah ini hanya MELAPORKAN: langkah deploy tetap penilainya, dan
      # `continue-on-error` menjaga agar diagnosa yang gagal tidak ikut
      # menggagalkan job. Yang dicetak hanya NAMA project dan service, tidak pernah
      # nilai token. Pesan pentingnya dinaikkan jadi anotasi job supaya terbaca
      # dari halaman commit tanpa membuka log.
      - name: Kenali kredensial Railway
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "Target: project=$RAILWAY_PROJECT_ID service=${RAILWAY_SERVICE:-$RAILWAY_SERVICE_DEFAULT}"

          if ! railway list --json > /tmp/projects.json 2>/tmp/projects.err; then
            echo "::warning::Token Railway ini tidak bisa membaca daftar project."
            sed -n '1,5p' /tmp/projects.err | sed 's/^/    /'
            echo "    Daftar project hanya bisa dibaca token AKUN. Token PROJECT (dibuat dari"
            echo "    Project Settings -> Tokens) tidak mengenal project lain, sehingga nama"
            echo "    service yang benar pun bisa dijawab 'Service ... not found'."
            exit 0
          fi

          RAILWAY_TARGET_PROJECT="$RAILWAY_PROJECT_ID" \
          RAILWAY_TARGET_SERVICE="${RAILWAY_SERVICE:-$RAILWAY_SERVICE_DEFAULT}" \
          python3 - <<'PY'
          import json
          import os

          projects = json.load(open("/tmp/projects.json"))
          target = os.environ["RAILWAY_TARGET_PROJECT"]
          service = os.environ["RAILWAY_TARGET_SERVICE"]

          def services(project):
              return [e["node"]["name"] for e in (project.get("services") or {}).get("edges", [])]

          print("Project yang terlihat token ini:")
          for p in projects:
              daftar = ", ".join(services(p)) or "(tanpa service)"
              print(f"  - {p['name']} [{p['id']}] -> {daftar}")

          ditunjuk = next((p for p in projects if p["id"] == target), None)
          if ditunjuk is None:
              print(
                  "::error::RAILWAY_PROJECT_ID tidak ada di daftar project yang bisa dibaca "
                  "token ini — periksa juga environment-nya."
              )
          elif service in services(ditunjuk):
              print(f"::notice::Kredensial cocok: project {ditunjuk['name']} memuat service {service}.")
          else:
              print(f"::error::Project {ditunjuk['name']} tidak memuat service {service}.")
              pemilik = [p for p in projects if service in services(p)]
              if pemilik:
                  for p in pemilik:
                      print(f"RAILWAY_PROJECT_ID untuk service {service} adalah {p['id']} (project {p['name']}).")
              else:
                  print(f"Token ini tidak melihat satu pun project yang memuat service {service}.")
          PY

      - name: Deploy ke Railway
        working-directory: .
        run: |
          set -o pipefail
          service="${RAILWAY_SERVICE:-$RAILWAY_SERVICE_DEFAULT}"
          echo "Target: service=$service environment=$RAILWAY_ENVIRONMENT"

          # Penanda build. `railway up` mengunggah direktori lokal dan tidak
          # membawa metadata git, sehingga Railway TIDAK mengisi
          # RAILWAY_GIT_COMMIT_SHA untuk deployment hasil CLI. Tanpa penanda ini,
          # `/health` tidak bisa membedakan kode baru dari kode lama, dan langkah
          # verifikasi kehilangan pembandingnya.
          #
          # Berkasnya sengaja TIDAK masuk `.gitignore`: `railway up` menghormati
          # `.gitignore` (lihat flag `--no-gitignore` di CLI-nya), jadi berkas yang
          # di-ignore justru hilang dari unggahan. Karena itu ia ditulis di sini,
          # dihapus lagi setelah unggahan selesai (`trap`), dan tidak pernah
          # ter-commit.
          meta="backend/build-meta.json"
          printf '{"commit": "%s", "builtAt": "%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$meta"
          trap 'rm -f "$meta"' EXIT

          if railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$service" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --ci 2>&1 | tee /tmp/railway-up.log; then
            exit 0
          fi

          if grep -q "not found" /tmp/railway-up.log; then
            echo "::error::Service '$service' tidak ada di project yang ditunjuk RAILWAY_PROJECT_ID."
            cat <<'PESAN'
          Perbaiki secret di Settings -> Secrets and variables -> Actions:
            RAILWAY_PROJECT_ID : id project yang BENAR-BENAR memuat service backend.
                                 Ambil dengan `railway list --json` (kolom `id`,
                                 lihat juga daftar `services` tiap project).
                                 Project produksi aplikasi ini bernama
                                 `truthful-imagination`; di akun ini HANYA project
                                 itu yang memuat service `ai-multimodal-app`.
                                 Project `vibrant-victory` memuat service lain
                                 (`pretty-connection`) dan tidak akan cocok.
            RAILWAY_SERVICE    : diisi HANYA kalau nama service backend bukan
                                 `ai-multimodal-app`.
            RAILWAY_TOKEN      : harus token untuk project yang sama; token project
                                 hanya berlaku pada satu project.
          Setelah diperbaiki, jalankan ulang: Actions -> Deploy to Railway & Vercel
          -> Run workflow.
          PESAN
          else
            echo "::error::railway up gagal - lihat log di atas (bukan masalah nama service)."
          fi

          exit 1

      # Verifikasi produksi, bukan sekadar "build sukses".
      #
      # Kegagalan nyata yang pernah terjadi: ketiga variabel CLOUDINARY_* tidak
      # pernah benar-benar tersimpan di service Railway, sehingga produksi
      # diam-diam memakai mode penyimpanan `local` — container menulis gambar ke
      # filesystem sementara, dan SETIAP deploy berikutnya menghapus riwayat
      # gambar user tanpa satu pun error. Build tetap hijau, aplikasi tetap
      # jalan; hanya berkasnya yang hilang.
      #
      # Kelas kegagalan kedua, yang tidak tertangkap oleh pemeriksaan mode:
      # kredensial yang TERISI tetapi TIDAK BERLAKU. Pemeriksaan konfigurasi hanya
      # bertanya "apakah variabelnya kosong", jadi nilai placeholder atau nilai
      # yang salah salin tetap membuat `/health` melaporkan `cloudinary` sementara
      # SETIAP unggahan ditolak provider. Akibatnya job tetap hijau dan yang
      # menemukannya adalah user.
      #
      # Karena itu deploy baru dianggap selesai hanya kalau `/health` produksi
      # menjawab `status: OK`, `database: connected`, mode penyimpanannya bukan
      # `local`, dan `storageCheck` — hasil benar-benar memanggil providernya —
      # sudah selesai serta tidak `failed`. Sebab kegagalannya dibaca dari
      # `storageCheckReason` supaya pesan error di sini bisa menuntun ke tindakan
      # yang tepat.
      #
      # Kelas kegagalan KETIGA, yang tidak tertangkap oleh apa pun di atas: kode
      # LAMA yang tetap live. Seluruh pemeriksaan di atas membaca kolom yang sama
      # benarnya di kode lama maupun baru, jadi deployment yang gagal — sementara
      # kode lama terus melayani user — tetap terlihat hijau. Karena itu `/health`
      # melaporkan commit yang sedang berjalan, dan langkah ini menuntut nilainya
      # sama dengan commit yang baru di-push.
      #
      # Langkah ini tidak mencetak nilai rahasia: `/health` sengaja hanya
      # mengirim satu kata per kolom plus KODE galat (`HTTP 401`, `timeout`),
      # tidak pernah nilai kredensial maupun pesan dari provider.
      - name: Verifikasi produksi - database, penyimpanan & kredensialnya
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          url = os.environ["PUBLIC_BACKEND_URL"].rstrip("/") + "/health"
          batas = time.time() + 300
          terakhir = None
          diharapkan = (os.environ.get("GITHUB_SHA") or "").strip().lower()

          while time.time() < batas:
              try:
                  with urllib.request.urlopen(url, timeout=30) as respons:
                      terakhir = json.loads(respons.read().decode())
                  print(" ", json.dumps(terakhir), flush=True)
                  # `storageCheck` boleh tidak ada di deployment lama; kalau ada,
                  # tunggu sampai selesai ('pending' -> 'ok'/'failed').
                  if (
                      terakhir.get("status") == "OK"
                      and terakhir.get("database") == "connected"
                      and terakhir.get("storageCheck") != "pending"
                  ):
                      # `/health` boleh belum melaporkan commit (deployment lama).
                      # Kalau sudah dilaporkan tetapi belum sama, deployment baru
                      # masih berjalan — jangan berhenti menunggu, karena itu
                      # persis keadaan yang membuat "kode lama masih live" tidak
                      # pernah terdeteksi.
                      berjalan = (terakhir.get("commit") or "").strip().lower()
                      if not diharapkan or not berjalan or berjalan == diharapkan:
                          break
              except Exception as galat:
                  print(f"  {url} belum siap: {type(galat).__name__}", flush=True)
              time.sleep(15)

          if not terakhir or terakhir.get("status") != "OK" or terakhir.get("database") != "connected":
              print("::error::Produksi tidak melaporkan status OK + database connected dalam 5 menit.")
              sys.exit(1)

          mode = terakhir.get("storageMode")
          check = terakhir.get("storageCheck")

          if mode is None:
              print("::warning::/health tidak melaporkan storageMode sehingga tidak bisa diverifikasi.")
          elif mode == "local":
              print(
                  "::error::Produksi memakai mode penyimpanan 'local': gambar user akan "
                  "hilang pada deploy berikutnya. Isi CLOUDINARY_CLOUD_NAME, "
                  "CLOUDINARY_API_KEY, dan CLOUDINARY_API_SECRET di service Railway, "
                  "lalu pastikan tidak ada variabel STORAGE_PROVIDER yang menimpanya."
              )
              sys.exit(1)
          else:
              print(f"::notice::Mode penyimpanan produksi: {mode}.")

          # Mode saja tidak cukup — lihat catatan di atas langkah ini. Kodenya
          # hanya memuat status HTTP/kode galat, tidak pernah pesan dari provider
          # (pesannya memuat endpoint dan nama bucket, dan log run repo ini publik).
          if check == "failed":
              # `failed` saja tidak menuntun ke tindakan apa pun, jadi kodenya
              # ikut dilaporkan: `HTTP 401/403` berarti nilainya salah,
              # `timeout` berarti providernya tidak menjawab. Sebelum kolom ini
              # ada, satu-satunya cara mengetahui sebabnya adalah membuka
              # dashboard Railway dan membaca log startup.
              sebab = terakhir.get("storageCheckReason", "tidak dilaporkan")
              print(
                  "::error::Kredensial penyimpanan ditolak provider: mode "
                  f"'{mode}' terkonfigurasi, tetapi pemeriksaannya gagal "
                  f"({sebab}), sehingga SETIAP generate gambar akan ditolak. "
                  "Periksa ulang nilai CLOUDINARY_* (atau S3_*) di service Railway "
                  "dan pastikan disalin utuh tanpa tanda kutip atau spasi ikut "
                  "terbawa."
              )
              sys.exit(1)
          elif check is None:
              print(
                  "::warning::/health tidak melaporkan storageCheck (deployment lama), "
                  "jadi kredensial penyimpanan tidak ikut diverifikasi."
              )
          elif check == "pending":
              print(
                  "::warning::Pemeriksaan kredensial penyimpanan belum selesai dalam 5 menit. "
                  "Jalankan ulang verifikasi ini setelah deploy berikutnya."
              )
          else:
              sebab = terakhir.get("storageCheckReason")
              print(
                  "::notice::Kredensial penyimpanan terverifikasi: "
                  f"{check}{f' ({sebab})' if sebab else ''}."
              )

          # Commit yang berjalan. Inilah yang membedakan "perintah deploy selesai"
          # dari "kode baru benar-benar melayani user".
          jalur = terakhir.get("commitSource") or "tidak dilaporkan"
          berjalan = (terakhir.get("commit") or "").strip().lower()

          if not diharapkan:
              print("::warning::GITHUB_SHA tidak tersedia sehingga commit produksi tidak bisa dibandingkan.")
          elif not berjalan:
              # Deployment yang berjalan SEBELUM kolom ini ada memang belum
              # memuatnya, jadi ini belum tentu masalah. Ketidakadaannya pada
              # deploy berikutnya berarti penandanya tidak terbaca.
              print(
                  "::warning::/health tidak melaporkan commit, jadi produksi tidak bisa "
                  "dipastikan menjalankan kode baru. Deployment yang lebih tua memang belum "
                  f"memuat kolom ini (jalur penanda: {jalur})."
              )
          elif berjalan != diharapkan:
              print(
                  f"::error::Produksi menjalankan commit {berjalan[:7]}, bukan {diharapkan[:7]} "
                  "yang baru di-push — deploy-nya belum selesai, gagal, atau diambil alih "
                  "deployment lain. Periksa Deploy Logs di Railway."
              )
              sys.exit(1)
          else:
              print(f"::notice::Produksi menjalankan commit {diharapkan[:7]} (sumber: {jalur}).")
          PY

  # Verifikasi deploy Frontend (Vercel).
  #
  # Job ini TIDAK mengunggah apa pun. Project Vercel terhubung ke repo GitHub
  # dan membangun setiap push ke `main` sendiri (`source: git`), jadi
  # mengunggah lagi hanya menghasilkan dua build untuk commit yang sama.
  #
  # Verifikasinya memakai REST API, bukan Vercel CLI. Token yang tersimpan di
  # repo ini hanya berlaku untuk API project: `vercel whoami` dan `vercel pull`
  # selalu menolaknya (`User not found`, lalu `Could not retrieve Project
  # Settings`) walau token yang sama berhasil untuk `GET /v9/projects` dan
  # `POST /v13/deployments`.
  #
  # Job tetap GAGAL kalau Vercel melaporkan `ERROR` atau kalau tidak ada
  # deployment untuk commit ini sampai batas waktu habis, sehingga status hijau
  # di sini berarti frontend benar-benar sudah ter-deploy.
  deploy-frontend:
    needs: quality
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_frontend == 'true')
    name: Verify Frontend on Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Nama secret di repo ini adalah VERCEL_PROJECT_ID (bukan
      # VERCEL_PROJECT_ID_FRONTEND seperti di workflow lama, yang membuat
      # project-id terkirim kosong).
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Pastikan kredensial tersedia
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN belum diisi di repo ini."
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Secret VERCEL_PROJECT_ID belum diisi di repo ini."
            exit 1
          fi

      - name: Tunggu deployment produksi untuk commit ini
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          project = os.environ["VERCEL_PROJECT_ID"]
          sha = os.environ["GITHUB_SHA"]
          batas = time.time() + 600

          def ambil():
              permintaan = urllib.request.Request(
                  f"https://api.vercel.com/v6/deployments?projectId={project}&limit=20",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "github-actions",
                  },
              )
              with urllib.request.urlopen(permintaan, timeout=30) as respons:
                  return json.loads(respons.read().decode()).get("deployments", [])

          def domain_produksi():
              permintaan = urllib.request.Request(
                  f"https://api.vercel.com/v9/projects/{project}/domains?limit=50",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "github-actions",
                  },
              )
              with urllib.request.urlopen(permintaan, timeout=30) as respons:
                  domains = json.loads(respons.read().decode()).get("domains", [])
              if not domains:
                  return None
              terverifikasi = [d["name"] for d in domains if d.get("verified")]
              return (terverifikasi or [domains[0]["name"]])[0]

          def periksa_tautan_langsung():
              # Frontend ini SPA: rute seperti /login hanya ada di sisi browser,
              # jadi Vercel harus melayani index.html untuk semua path. Tanpa
              # aturan `rewrites` di frontend/vercel.json, beranda tetap terbuka
              # normal tetapi SETIAP tautan langsung dijawab 404 — kegagalan yang
              # mudah lolos kalau hanya halaman utama yang dicek.
              domain = domain_produksi()
              if not domain:
                  print("::warning::domain produksi tidak terdeteksi, uji tautan langsung dilewati")
                  return
              for path in ("/", "/login", "/tools/text-to-image"):
                  url = f"https://{domain}{path}"
                  try:
                      with urllib.request.urlopen(url, timeout=30) as respons:
                          isi = respons.read().decode(errors="replace")
                          status = respons.status
                  except urllib.error.HTTPError as galat:
                      print(f"::error::{url} menjawab {galat.code} — rute SPA tidak dilayani.")
                      sys.exit(1)
                  if status != 200 or 'id="root"' not in isi:
                      print(f"::error::{url} tidak mengembalikan aplikasi (status {status}).")
                      sys.exit(1)
                  print(f"  {url} -> {status}")

          while True:
              try:
                  daftar = ambil()
              except urllib.error.HTTPError as galat:
                  print(f"::error::API Vercel menolak permintaan: {galat.code}")
                  print(galat.read().decode(errors="replace")[:300])
                  sys.exit(1)

              milik_commit = [
                  d for d in daftar
                  if (d.get("meta") or {}).get("githubCommitSha") == sha
              ]
              for d in milik_commit:
                  print(f"  {d['uid']}  {d['state']:<9} target={d.get('target')}  https://{d.get('url')}")

              siap = [
                  d for d in milik_commit
                  if d["state"] == "READY" and d.get("target") in ("production", None)
              ]
              if siap:
                  print(f"::notice::Frontend siap: https://{siap[0].get('url')}")
                  periksa_tautan_langsung()
                  sys.exit(0)

              if any(d["state"] in ("ERROR", "CANCELED") for d in milik_commit):
                  print(f"::error::Vercel melaporkan ERROR untuk commit {sha[:8]}.")
                  sys.exit(1)

              if time.time() > batas:
                  print(f"::error::Tidak ada deployment READY untuk commit {sha[:8]} dalam 10 menit.")
                  sys.exit(1)

              time.sleep(15)
          PY

