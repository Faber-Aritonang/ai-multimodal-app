name: Deploy to Railway & Vercel

# Deploy memakai CLI resmi (Railway CLI & Vercel CLI), BUKAN action pihak ketiga.
#
# Alasannya konkret: workflow sebelumnya memakai `railway/railway-github-action`
# (repositori action-nya sudah tidak ada sehingga job gagal di langkah "Set up
# job") dan `amondnet/vercel-action@v30` (tag v30 tidak pernah ada; rilisnya
# melompat ke v42). Keduanya bukan soal kode aplikasi, tapi referensi action yang
# bisa hilang kapan saja.
#
# Catatan: repo ini publik, jadi log run juga publik. Tahap diagnostik di bawah
# sengaja hanya mencetak NAMA service, tanpa nilai environment variable.
#
# Uji ulang referensi versi: `npm view @railway/cli version` dan
# `npm view vercel version`.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend to Railway'
        required: false
        default: 'true'
      deploy_frontend:
        description: 'Deploy Frontend to Vercel'
        required: false
        default: 'true'

# Deploy dijalankan satu per satu untuk ref yang sama: push baru menunggu
# deploy yang sedang berjalan selesai (tidak dibatalkan di tengah jalan, karena
# deploy yang terpotong bisa meninggalkan aplikasi dalam keadaan setengah jadi).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Dipin ke major version agar tidak berubah sendiri.
  RAILWAY_CLI_VERSION: '5'
  RAILWAY_ENVIRONMENT: 'production'
  # Nama service Railway. Nilai ini bukan tebakan: diambil dari daftar service
  # yang dicetak langkah diagnostik (`railway service list`) — project tujuan
  # hanya punya satu service, bernama "ai-multimodal-app". Bisa diganti tanpa
  # mengubah workflow dengan menambah secret RAILWAY_SERVICE.
  RAILWAY_SERVICE_DEFAULT: 'ai-multimodal-app'

jobs:
  # Quality gate: unit test backend + lint & build frontend.
  # Test backend tidak butuh kredensial apa pun (tanpa Mongo/Firebase).
  quality:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - install dependencies
        run: npm ci
        working-directory: backend

      - name: Backend - run unit tests
        run: npm test
        working-directory: backend

      - name: Frontend - install dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend - lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend - build
        run: npm run build
        working-directory: frontend

  # Deploy Backend ke Railway.
  #
  # `railway up` mengunggah direktori backend dan membangunnya di Railway
  # (Nixpacks mendeteksi Node dari package.json), jadi tidak perlu memasang
  # dependency di runner. Tanpa `--detach`, perintah ini menunggu build selesai
  # dan gagal kalau build-nya gagal — itu yang membuat status job jujur.
  deploy-backend:
    needs: quality
    if: github.event_name == 'push' || github.event.inputs.deploy_backend == 'true'
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      # Opsional: diisi hanya kalau nama service-nya bukan default di atas.
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Pastikan kredensial tersedia
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Secret RAILWAY_TOKEN belum diisi di repo ini."
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "::error::Secret RAILWAY_PROJECT_ID belum diisi di repo ini."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"

      # Kalau nama service salah, error CLI hanya berbunyi "Service not found" —
      # tidak memberi tahu nama yang benar. Langkah ini mencetak daftar nama
      # service di environment tujuan supaya penyebabnya langsung kelihatan.
      - name: Diagnostik - daftar service Railway
        run: |
          railway service list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --json > /tmp/railway-services.json 2>/tmp/railway-services.err || true

          node - <<'NODE'
          const fs = require('fs');
          const target = process.env.RAILWAY_SERVICE || process.env.RAILWAY_SERVICE_DEFAULT;

          let raw = '';
          try { raw = fs.readFileSync('/tmp/railway-services.json', 'utf8'); } catch {}

          let data = null;
          try { data = JSON.parse(raw); } catch {}

          const list = !data ? [] : (Array.isArray(data) ? data : (data.services || data.items || []));
          const names = list.map((s) => s.name || s.serviceName).filter(Boolean);

          console.log('Service tujuan :', target);
          console.log('Service tersedia:', names.length ? names.join(', ') : '(tidak terbaca)');

          if (names.length && !names.includes(target)) {
            console.log(`::warning::Service "${target}" tidak ada di project ini. ` +
              'Ganti nilainya di env RAILWAY_SERVICE_DEFAULT atau tambahkan secret RAILWAY_SERVICE.');
          }
          NODE

          if [ -s /tmp/railway-services.err ]; then
            echo "--- pesan CLI ---"
            head -5 /tmp/railway-services.err
          fi

      # Diagnostik penyimpanan media.
      #
      # Kegagalan nyata yang pernah terjadi: variabel CLOUDINARY_* sudah diisi di
      # dashboard, tetapi service produksi tetap melaporkan `storageMode: "local"`
      # di /health — artinya setiap deploy menghapus gambar user tanpa satu pun
      # error. Penyebabnya hanya kelihatan dari daftar variabel yang BENAR-BENAR
      # dimiliki service (mis. `STORAGE_PROVIDER` yang terlanjur ada, atau
      # variabel yang tersimpan di environment/service lain).
      #
      # Log run repo ini PUBLIK, jadi langkah ini hanya mencetak NAMA variabel:
      # nilainya dibuang sebelum apa pun masuk ke stdout.
      - name: Diagnostik - variabel penyimpanan media
        run: |
          SERVICE="${RAILWAY_SERVICE:-$RAILWAY_SERVICE_DEFAULT}"

          railway variables \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --json > /tmp/railway-vars.json 2>/tmp/railway-vars.err || true

          # Cadangan bila versi CLI ini tidak mengenal --json: `--kv` lalu ambil
          # sisi kiri tanda '=' saja, sehingga nilai rahasia tidak pernah terbaca.
          if [ ! -s /tmp/railway-vars.json ]; then
            railway variables \
              --project "$RAILWAY_PROJECT_ID" \
              --service "$SERVICE" \
              --environment "$RAILWAY_ENVIRONMENT" \
              --kv > /tmp/railway-vars.kv 2>/tmp/railway-vars.err || true
          fi

          node - <<'NODE'
          const fs = require('fs');

          const namaDariKv = () => {
            try {
              return fs
                .readFileSync('/tmp/railway-vars.kv', 'utf8')
                .split(/\r?\n/)
                .map((baris) => baris.split('=')[0].trim())
                .filter(Boolean);
            } catch {
              return [];
            }
          };

          let daftar = [];
          let sumber = 'tidak terbaca';

          try {
            const mentah = JSON.parse(fs.readFileSync('/tmp/railway-vars.json', 'utf8'));
            if (Array.isArray(mentah)) {
              daftar = mentah.map((v) => v.name || v.key || v.k || '').filter(Boolean);
            } else if (mentah && typeof mentah === 'object') {
              daftar = Object.keys(mentah);
            }
            sumber = 'json';
          } catch {
            daftar = namaDariKv();
            sumber = daftar.length ? 'kv (hanya nama)' : 'tidak terbaca';
          }

          const relevan = (nama) =>
            /^(STORAGE_PROVIDER|UPLOAD_DIR|CLOUDINARY_[A-Z0-9_]+|S3_[A-Z0-9_]+)$/.test(nama);

          const media = daftar.filter(relevan).sort();
          const wajibCloudinary = ['CLOUDINARY_CLOUD_NAME', 'CLOUDINARY_API_KEY', 'CLOUDINARY_API_SECRET'];
          const hilang = wajibCloudinary.filter((nama) => !media.includes(nama));
          const adaProvider = daftar.includes('STORAGE_PROVIDER');

          console.log(`sumber data             : ${sumber}`);
          console.log(`jumlah variabel service : ${daftar.length}`);
          console.log(`variabel media ada      : ${media.length ? media.join(', ') : '(tidak ada satu pun)'}`);
          console.log(`CLOUDINARY belum ada    : ${hilang.length ? hilang.join(', ') : '(lengkap)'}`);

          if (adaProvider) {
            console.log(
              '::warning::STORAGE_PROVIDER ada di service ini dan SELALU menang atas kredensial ' +
                'cloudinary/s3. Hapus variabel itu di Railway supaya mode ditentukan kredensialnya.'
            );
          }

          if (hilang.length) {
            console.log(
              '::warning::Produksi akan memakai mode local: ' + hilang.join(', ') +
                ' tidak ada di service ini, sehingga gambar user hilang pada setiap deploy.'
            );
          } else if (!adaProvider) {
            console.log(
              'OK: kredensial Cloudinary lengkap dan tidak ada STORAGE_PROVIDER — ' +
                'production /health seharusnya melaporkan storageMode=cloudinary.'
            );
          }
          NODE

          if [ -s /tmp/railway-vars.err ]; then
            echo "--- pesan CLI (3 baris pertama) ---"
            head -3 /tmp/railway-vars.err
          fi

      # PENTING — `railway up` dijalankan dari AKAR repo, bukan dari `backend/`.
      # Service Railway menetapkan `rootDirectory: backend`, dan builder
      # menggabungkannya dengan konteks unggahan: mengunggah direktori `backend`
      # membuat builder mencari `backend/backend` lalu gagal (deployment
      # `FAILED` dengan `commit=-`, tanpa log build yang menjelaskan sebabnya).
      # Dari akar repo, konteks unggahan sama dengan konteks deployment GitHub,
      # sehingga `backend/` terbentuk benar.
      - name: Deploy ke Railway
        working-directory: .
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --service "${RAILWAY_SERVICE:-$RAILWAY_SERVICE_DEFAULT}" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --ci

  # Verifikasi deploy Frontend (Vercel).
  #
  # Job ini TIDAK mengunggah apa pun. Project Vercel terhubung ke repo GitHub
  # dan membangun setiap push ke `main` sendiri (`source: git`), jadi
  # mengunggah lagi hanya menghasilkan dua build untuk commit yang sama.
  #
  # Verifikasinya memakai REST API, bukan Vercel CLI. Token yang tersimpan di
  # repo ini hanya berlaku untuk API project: `vercel whoami` dan `vercel pull`
  # selalu menolaknya (`User not found`, lalu `Could not retrieve Project
  # Settings`) walau token yang sama berhasil untuk `GET /v9/projects` dan
  # `POST /v13/deployments`.
  #
  # Job tetap GAGAL kalau Vercel melaporkan `ERROR` atau kalau tidak ada
  # deployment untuk commit ini sampai batas waktu habis, sehingga status hijau
  # di sini berarti frontend benar-benar sudah ter-deploy.
  deploy-frontend:
    needs: quality
    if: github.event_name == 'push' || github.event.inputs.deploy_frontend == 'true'
    name: Verify Frontend on Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Nama secret di repo ini adalah VERCEL_PROJECT_ID (bukan
      # VERCEL_PROJECT_ID_FRONTEND seperti di workflow lama, yang membuat
      # project-id terkirim kosong).
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Pastikan kredensial tersedia
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN belum diisi di repo ini."
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Secret VERCEL_PROJECT_ID belum diisi di repo ini."
            exit 1
          fi

      - name: Tunggu deployment produksi untuk commit ini
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          project = os.environ["VERCEL_PROJECT_ID"]
          sha = os.environ["GITHUB_SHA"]
          batas = time.time() + 600

          def ambil():
              permintaan = urllib.request.Request(
                  f"https://api.vercel.com/v6/deployments?projectId={project}&limit=20",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "github-actions",
                  },
              )
              with urllib.request.urlopen(permintaan, timeout=30) as respons:
                  return json.loads(respons.read().decode()).get("deployments", [])

          def domain_produksi():
              permintaan = urllib.request.Request(
                  f"https://api.vercel.com/v9/projects/{project}/domains?limit=50",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "github-actions",
                  },
              )
              with urllib.request.urlopen(permintaan, timeout=30) as respons:
                  domains = json.loads(respons.read().decode()).get("domains", [])
              if not domains:
                  return None
              terverifikasi = [d["name"] for d in domains if d.get("verified")]
              return (terverifikasi or [domains[0]["name"]])[0]

          def periksa_tautan_langsung():
              # Frontend ini SPA: rute seperti /login hanya ada di sisi browser,
              # jadi Vercel harus melayani index.html untuk semua path. Tanpa
              # aturan `rewrites` di frontend/vercel.json, beranda tetap terbuka
              # normal tetapi SETIAP tautan langsung dijawab 404 — kegagalan yang
              # mudah lolos kalau hanya halaman utama yang dicek.
              domain = domain_produksi()
              if not domain:
                  print("::warning::domain produksi tidak terdeteksi, uji tautan langsung dilewati")
                  return
              for path in ("/", "/login", "/tools/text-to-image"):
                  url = f"https://{domain}{path}"
                  try:
                      with urllib.request.urlopen(url, timeout=30) as respons:
                          isi = respons.read().decode(errors="replace")
                          status = respons.status
                  except urllib.error.HTTPError as galat:
                      print(f"::error::{url} menjawab {galat.code} — rute SPA tidak dilayani.")
                      sys.exit(1)
                  if status != 200 or 'id="root"' not in isi:
                      print(f"::error::{url} tidak mengembalikan aplikasi (status {status}).")
                      sys.exit(1)
                  print(f"  {url} -> {status}")

          while True:
              try:
                  daftar = ambil()
              except urllib.error.HTTPError as galat:
                  print(f"::error::API Vercel menolak permintaan: {galat.code}")
                  print(galat.read().decode(errors="replace")[:300])
                  sys.exit(1)

              milik_commit = [
                  d for d in daftar
                  if (d.get("meta") or {}).get("githubCommitSha") == sha
              ]
              for d in milik_commit:
                  print(f"  {d['uid']}  {d['state']:<9} target={d.get('target')}  https://{d.get('url')}")

              siap = [
                  d for d in milik_commit
                  if d["state"] == "READY" and d.get("target") in ("production", None)
              ]
              if siap:
                  print(f"::notice::Frontend siap: https://{siap[0].get('url')}")
                  periksa_tautan_langsung()
                  sys.exit(0)

              if any(d["state"] in ("ERROR", "CANCELED") for d in milik_commit):
                  print(f"::error::Vercel melaporkan ERROR untuk commit {sha[:8]}.")
                  sys.exit(1)

              if time.time() > batas:
                  print(f"::error::Tidak ada deployment READY untuk commit {sha[:8]} dalam 10 menit.")
                  sys.exit(1)

              time.sleep(15)
          PY

